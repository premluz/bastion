<!-- Merriweather (--font-voice / --face-voice, tokens.base.css) — direct
     feedback: "our serif font should be Merriweather." The prior value
     (Crimson Text/Pro) was never actually loaded as a web font anywhere
     in this repo (no @font-face, no <link>, confirmed by search) — it
     silently fell back through the stack to Georgia/serif on any system
     without Crimson installed locally, which is most of them. Loading a
     real web font via Google Fonts here (Storybook's own sanctioned
     preview-head.html injection point, auto-detected with no main.ts
     change needed) instead of just swapping the stack's first name,
     since a name-only swap would have had the exact same
     silently-falls-back problem the prior value already had. Weights:
     400/700 + italic, covering TextBlock's body prose and
     Recommendation's Blockquote (both consumers of --face-voice,
     confirmed via grep) without over-fetching styles nothing uses.
     Phase 10's real app/index.html (doesn't exist yet) will need this
     same tag when it's built — noted, not yet actionable. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap"
  rel="stylesheet"
/>
<!-- Inter (VirtualCardPlaceholder.module.css) — direct feedback: "change
     font to Inter, in the card." Scoped to the card only, not a
     --face-ui/global swap, so loaded here the same way Merriweather is:
     Storybook's own sanctioned preview-head.html injection point.
     Weight 600 covers the brand/digits/network Text elements, all
     weight="semibold" in that component. -->
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
  rel="stylesheet"
/>
<!-- Geist + Geist Mono (--font-geist / --font-geist-mono, tokens.base.css) —
     bastion theme's sans and eyebrow faces (2026-10-06, direct feedback),
     loaded the same way as Merriweather/Inter above. -->
<link
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
