<!doctype html>
<html lang="en" data-theme="bastion" data-astryx-theme="neutral">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the shell positions itself with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0A" />
    <!-- Installable full-screen app (2026-10-09): added to the Home Screen it opens
         without browser chrome. iOS ignores the manifest's display mode, so it
         needs its own tags; black-translucent lets the page run under the status bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bastion" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Bastion</title>
    <!-- Web fonts: Merriweather (--font-voice), Inter (card art), Geist + Geist
         Mono (bastion's sans and eyebrows). Same sources as
         .storybook/preview-head.html — keep the two in step. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
